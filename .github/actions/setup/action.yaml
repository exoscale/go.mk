name: "Setup Go"
description: "Sets up Go environment with built-in caching"
inputs:
  go-version-file:
    description: "Path to the go.mod file to determine Go version"
    required: false
    default: "go.mod"
  cache:
    description: "Enable built-in caching"
    required: false
    default: "false"
runs:
  using: "composite"
  steps:
    - uses: actions/setup-go@v6
      with:
        go-version-file: ${{ inputs.go-version-file }}
        check-latest: true
        cache: ${{ inputs.cache }}
        cache-dependency-path: 'go.sum'
